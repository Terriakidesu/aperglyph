[package]
name = "aperglyph-desktop"
version = "0.14.0"
description = "AperGlyph local-first diagram editor"
authors = ["AperGlyph"]
edition = "2024"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aperglyph-desktop-storage = { path = "../crates/desktop-storage" }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }
