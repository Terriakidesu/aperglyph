[package]
name = "aperglyph-desktop-storage"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Transactional SQLite workspace storage for the AperGlyph desktop app"

[dependencies]
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
